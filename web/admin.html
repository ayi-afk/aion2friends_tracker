<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker Admin</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<style>
:root {
  color-scheme: dark;
  --bg: #0b0f17; --panel: #10161f; --panel-2: #151c27; --line: #1f2a38; --line-2: #2a3647;
  --text: #e6ecf5; --text-2: #a7b3c6; --muted: #6c7a90; --accent: #f5a623;
  --good: #3ddc84; --bad: #e66767; --warn: #fab219;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 18px 20px 60px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
header h1 { margin: 0; font-size: 20px; }
header .tag { font: 600 11px var(--mono); color: var(--accent); border: 1px solid #4a3412; background: #1d1509; border-radius: 6px; padding: 2px 8px; }
.spacer { flex: 1; }
.btn { background: var(--panel-2); border: 1px solid var(--line-2); color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn:hover { border-color: #3a4d68; background: #1a2331; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: #ffb3b3; border-color: #4a2020; background: #1d1010; }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { background: transparent; border: 0; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--text-2); font-weight: 700; font-size: 12px; }
.seg button:hover { color: var(--text); }
.seg button.on { background: #233046; color: #fff; box-shadow: inset 0 0 0 1px #34465f; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 18px; }
.card h2 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.card h2 .spacer { flex: 1; }
.muted { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat.wide { grid-column: 1 / -1; }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.stat .v { font: 600 16px var(--mono); margin-top: 2px; word-break: break-all; }
.stat .v.small { font-size: 12px; font-weight: 400; color: var(--text-2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid #161e2a; vertical-align: middle; }
tr:hover td { background: #121a25; }
.num { text-align: right; font-family: var(--mono); }
.av { width: 38px; height: 38px; border-radius: 50%; background: #1b2431 center/cover; border: 2px solid var(--c, #444); flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
.who { display: flex; gap: 10px; align-items: center; }
.who b { display: block; }
.who small { color: var(--muted); }
.err { color: var(--bad); font-size: 12px; max-width: 260px; white-space: normal; }
.ok { color: var(--good); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.tablewrap { overflow-x: auto; }

/* switches */
.switch { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: #283244; border-radius: 22px; cursor: pointer; transition: .15s; }
.switch span::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #9aa6b8; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: #2f6d3e; }
.switch input:checked + span::before { transform: translateX(16px); background: #fff; }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.swl { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }

/* forms */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
label.f { display: grid; gap: 5px; font-size: 12px; color: var(--text-2); font-weight: 600; }
input[type=text], input[type=password], input[type=number], select { background: #0c121a; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; color: var(--text); width: 100%; }
input:focus, select:focus { outline: 2px solid #f5a62366; border-color: var(--accent); }
input[type=color] { width: 44px; height: 34px; border: 1px solid var(--line-2); border-radius: 8px; background: #0c121a; padding: 2px; cursor: pointer; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* modal */
.modal { position: fixed; inset: 0; background: #000a; display: none; place-items: center; z-index: 30; padding: 16px; }
.modal.show { display: grid; }
.modal .box { background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; width: min(780px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px 22px; box-shadow: 0 20px 60px #000c; }
.modal h3 { margin: 0 0 14px; font-size: 17px; }
.searchrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px 16px; align-items: end; }
@media (max-width: 640px) { .searchrow { grid-template-columns: 1fr; } }
.avatar-edit { display: flex; gap: 16px; align-items: center; }
.avatar-edit .big { width: 96px; height: 96px; border-radius: 50%; background: #1b2431 center/cover; border: 3px solid var(--c, #444); display: grid; place-items: center; font-size: 28px; font-weight: 700; flex: none; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 12px; color: var(--muted); font-size: 12px; text-align: center; cursor: pointer; flex: 1; }
.drop.over { border-color: var(--accent); color: var(--text); }

/* search results (shugo-style) */
.hits { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden auto; max-height: 280px; }
.hits:empty { display: none; }
.hits .msg { padding: 12px 14px; }
.hit { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; border-top: 1px solid var(--line); }
.hit:first-child { border-top: 0; }
.hit:hover { background: #141c28; }
.hit.sel { background: #1d1709; box-shadow: inset 3px 0 0 var(--accent); }
.hit img { width: 36px; height: 36px; border-radius: 50%; background: #1b2431; object-fit: cover; flex: none; }
.hit .hn { font-weight: 700; font-size: 15px; color: #fff; }
.hit .hm { font-size: 13px; color: var(--text-2); display: flex; gap: 10px; flex-wrap: wrap; }
.hit .lv { color: #f0c419; font-weight: 600; }
.hit .race { margin-left: auto; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; flex: none; }
.race.asmo { background: #2a1d3d; color: #b48cf2; }
.race.elyos { background: #13303a; color: #6fd3e8; }

.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--muted); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1d2838; border: 1px solid #3a4d68; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.bad { border-color: #6a2a2a; background: #2a1414; }
.login { max-width: 360px; margin: 14vh auto; }
.teams { display: grid; gap: 8px; }
.team { display: grid; grid-template-columns: 50px 1fr 90px auto auto; gap: 8px; align-items: center; }
@media (max-width: 700px) { .team { grid-template-columns: 44px 1fr; } }
</style>
</head>
<body>
<div id="loginView" class="wrap" hidden>
  <div class="card login">
    <h2><span data-i18n="login_title">🔒 Panel admina</span><span class="spacer"></span><span class="seg langSw"><button data-l="pl">PL</button><button data-l="en">EN</button></span></h2>
    <form id="loginForm" class="form" style="grid-template-columns:1fr">
      <label class="f"><span data-i18n="password">Hasło</span> <input type="password" id="pw" autocomplete="current-password" autofocus></label>
      <button class="btn primary" type="submit" data-i18n="login">Zaloguj</button>
      <div class="note" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <header>
    <h1>AION 2 Tracker</h1><span class="tag">ADMIN · localhost</span>
    <span class="spacer"></span>
    <span class="seg langSw" aria-label="Language"><button data-l="pl">PL</button><button data-l="en">EN</button></span>
    <a class="btn" href="/" target="_blank" data-i18n="open_chart">↗ Wykres</a>
    <button class="btn" id="fetchAll" data-i18n="fetch_all">⟳ Zbierz teraz (wszyscy aktywni)</button>
    <button class="btn" id="logout" hidden data-i18n="logout">Wyloguj</button>
  </header>

  <section class="card">
    <h2 data-i18n="worker_status">Status workera</h2>
    <div class="stats" id="stats"></div>
  </section>

  <section class="card">
    <h2><span data-i18n="players">Gracze</span> <span class="muted" id="pcount"></span><span class="spacer"></span><button class="btn primary" id="addPlayer" data-i18n="add_player">+ Dodaj gracza</button></h2>
    <div class="note" style="margin:-4px 0 10px" data-i18n-html="players_note"></div>
    <div class="tablewrap">
      <table id="players">
        <thead><tr><th data-i18n="th_player">Gracz</th><th data-i18n="th_char">Postać</th><th data-i18n="th_team">Team</th><th class="num">CP</th><th class="num">iLvl</th><th class="num" data-i18n="th_samples">Próbek</th><th data-i18n="th_last">Ostatni odczyt</th><th data-i18n="th_active">Aktywny</th><th data-i18n="th_visible">Na wykresie</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2><span data-i18n="teams">Teamy</span><span class="spacer"></span><button class="btn" id="addTeam" data-i18n="new_team">+ Nowy team</button></h2>
    <div class="note" style="margin:-4px 0 10px" data-i18n="teams_note"></div>
    <div class="teams" id="teams"></div>
  </section>

  <section class="card">
    <h2 data-i18n="chart_settings">Ustawienia wykresu</h2>
    <form class="form" id="settingsForm">
      <label class="f"><span data-i18n="page_title">Tytuł strony</span> <input type="text" id="sTitle" maxlength="80"></label>
      <label class="f"><span data-i18n="default_mode">Domyślny tryb</span>
        <select id="sMode">
          <option value="cp">Combat Power</option><option value="ilvl">Item Level</option>
          <option value="dv" data-i18n="opt_dv"></option><option value="god" data-i18n="opt_god"></option>
          <option value="weapon" data-i18n="opt_weapon"></option><option value="stigma" data-i18n="opt_stigma"></option><option value="level" data-i18n="opt_level"></option>
        </select></label>
      <label class="f"><span data-i18n="default_range">Domyślne okno czasu</span>
        <select id="sRange">
          <option value="3600">1h</option><option value="21600">6h</option><option value="86400">24h</option><option value="259200" data-i18n="d3"></option>
          <option value="604800" data-i18n="d7"></option><option value="2592000" data-i18n="d30"></option><option value="0" data-i18n="all"></option>
        </select></label>
      <label class="f"><span data-i18n="default_lang">Domyślny język strony</span>
        <select id="sLang">
          <option value="auto" data-i18n="lang_auto"></option><option value="pl">Polski</option><option value="en">English</option>
        </select></label>
      <div style="display:flex;align-items:end"><button class="btn primary" type="submit" data-i18n="save_settings">Zapisz ustawienia</button></div>
    </form>
    <div class="note" style="margin-top:8px" data-i18n="settings_note"></div>
  </section>

  <section class="card">
    <h2 data-i18n="db_title">Baza danych — eksport / import</h2>
    <div class="row">
      <a class="btn" href="/api/admin/export" download data-i18n="export">⤓ Eksportuj bazę (.db)</a>
      <label class="btn"><span data-i18n="import">⤒ Importuj i scal bazę…</span><input type="file" id="importFile" accept=".db,.sqlite,.sqlite3,application/octet-stream" hidden></label>
      <span class="note" id="importRes"></span>
    </div>
    <p class="note" data-i18n="import_note"></p>
  </section>
</div>

<div class="modal" id="pmodal" role="dialog" aria-modal="true">
  <div class="box">
    <h3 id="pmTitle"></h3>
    <div class="searchrow">
      <label class="f"><span data-i18n="char_name">Nick w grze</span> <input type="text" id="pmChar" maxlength="40" data-i18n-ph="char_ph" autocomplete="off"></label>
      <label class="f"><span data-i18n="server">Serwer</span> <select id="pmServer"></select></label>
      <button class="btn" id="pmSearch" type="button" data-i18n="search">🔍 Szukaj</button>
    </div>
    <div class="note" style="margin-top:6px" data-i18n="search_hint"></div>
    <div class="hits" id="pmHits"></div>
    <div class="form" style="margin-top:14px">
      <label class="f"><span data-i18n="display_name">Wyświetlany nick (streamer)</span> <input type="text" id="pmDisplay" maxlength="40" data-i18n-ph="display_ph"></label>
      <label class="f"><span data-i18n="th_team">Team</span> <select id="pmTeam"></select></label>
      <label class="f"><span data-i18n="line_color">Kolor linii</span>
        <span class="row"><input type="color" id="pmColor" value="#3987e5"><label class="swl"><input type="checkbox" id="pmColorAuto" checked> <span data-i18n="color_auto">automatycznie (team / paleta)</span></label></span></label>
      <label class="f"><span data-i18n="sort">Kolejność (sort)</span> <input type="number" id="pmSort" value="0"></label>
      <div class="row" style="align-items:end;gap:18px">
        <label class="swl"><span class="switch"><input type="checkbox" id="pmActive" checked><span></span></span> <span data-i18n="active_collect">Aktywny (zbieraj)</span></label>
        <label class="swl"><span class="switch"><input type="checkbox" id="pmVisible" checked><span></span></span> <span data-i18n="th_visible">Na wykresie</span></label>
      </div>
    </div>
    <div style="margin-top:16px" class="f"><span style="font-size:12px;color:var(--text-2);font-weight:600">Avatar</span></div>
    <div class="avatar-edit" style="margin-top:6px">
      <div class="big" id="pmAvatar"></div>
      <div class="drop" id="pmDrop"><span data-i18n="drop">Upuść obrazek albo kliknij</span><br><span class="muted" data-i18n="drop_note"></span><input type="file" id="pmFile" accept="image/*" hidden><div class="note" id="pmAvNote" style="margin-top:6px;color:var(--text-2)"></div></div>
      <button class="btn small" type="button" id="pmAvClear" data-i18n="use_game" data-i18n-title="use_game_title">Użyj z gry</button>
    </div>
    <div class="actions">
      <button class="btn danger" id="pmDelete" type="button" hidden data-i18n="delete_player">Usuń gracza</button>
      <span class="spacer"></span>
      <button class="btn" id="pmCancel" type="button" data-i18n="cancel">Anuluj</button>
      <button class="btn primary" id="pmSave" type="button" data-i18n="save">Zapisz</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

const pad2 = n => String(n).padStart(2, '0');
function fmtDur(sec) { sec = Math.max(0, Math.round(sec)); if (sec < 60) return sec + 's'; const m = Math.floor(sec / 60), h = Math.floor(m / 60), d = Math.floor(h / 24); if (m < 60) return m + 'm'; if (h < 24) return h + 'h' + (m % 60 ? ' ' + m % 60 + 'm' : ''); return d + 'd' + (h % 24 ? ' ' + h % 24 + 'h' : ''); }
function fmtTime(ts) { if (!ts) return '—'; const d = new Date(ts * 1000); return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function fmtBytes(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(0) + ' kB'; }
const initials = n => (n || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
function toast(msg, bad) { const el = $('#toast'); el.textContent = msg; el.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toast.h); toast.h = setTimeout(() => el.className = 'toast', 2800); }

async function api(path, body, raw) {
  const opt = { headers: { 'X-A2T': '1', 'X-Lang': LANG }, cache: 'no-store' };
  if (body !== undefined) {
    opt.method = 'POST';
    if (raw) { opt.body = body; opt.headers['Content-Type'] = 'application/octet-stream'; }
    else { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
  }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || T('login_required')); }
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

    || `<div class="muted">${T('no_teams')}</div>`;

  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? res(b) : rej(new Error(T('convert_failed'))), 'image/png');
    };
    img.onerror = () => rej(new Error(T('load_failed')));
    img.src = URL.createObjectURL(file);
  });
}
async function handleImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return toast(T('not_image'), true);
  if (file.size > 15 * 1024 * 1024) return toast(T('too_big'), true);
  try {
    avatarFile = SERVER_FORMATS.includes(file.type) ? file : await toPng(file);
  } catch (e) { return toast(e.message, true); }
  avatarAction = 'keep'; avatarData = '';
  setAvatarPreview(URL.createObjectURL(avatarFile), '', $('#pmAvatar').style.getPropertyValue('--c'));
  $('#pmAvNote').textContent = T('av_pending', file.name);
}
$('#pmDrop').onclick = () => $('#pmFile').click();
$('#pmFile').onchange = e => handleImageFile(e.target.files[0]);
['dragenter', 'dragover'].forEach(ev => $('#pmDrop').addEventListener(ev, e => { e.preventDefault(); $('#pmDrop').classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => $('#pmDrop').addEventListener(ev, e => { e.preventDefault(); $('#pmDrop').classList.remove('over'); }));
$('#pmDrop').addEventListener('drop', e => handleImageFile(e.dataTransfer.files[0]));
$('#pmAvClear').onclick = () => {
  avatarAction = 'clear'; avatarData = ''; avatarFile = null;
  $('#pmAvNote').textContent = T('av_cleared');
  setAvatarPreview(editing && editing.has_game_avatar ? `/avatar/${editing.id}?game=1&t=${Date.now()}` : '', $('#pmDisplay').value, $('#pmAvatar').style.getPropertyValue('--c'));
};

$('#pmSave').onclick = async () => {
  const sel = $('#pmServer').selectedOptions[0];
  const serverId = +$('#pmServer').value;
  const body = {
    id: editing ? editing.id : 0,
    display_name: $('#pmDisplay').value.trim(),
    char_name: $('#pmChar').value.trim(),
    server_id: serverId,
    server_name: sel ? (sel.dataset.name || '') : '',
    character_id: pickedCharId,
    team_id: +$('#pmTeam').value,
    color: $('#pmColorAuto').checked ? '' : $('#pmColor').value,
    active: $('#pmActive').checked,
    visible: $('#pmVisible').checked,
    sort: +$('#pmSort').value || 0,
    avatar_action: avatarAction,
    avatar: avatarData,
  };
  if (!body.char_name || !serverId) return toast(T('need_char_server'), true);
  $('#pmSave').disabled = true;
  try {
    const r = await api('/api/admin/player/save', body);
    if (avatarFile) {
      try { await api(`/api/admin/player/${r.id}/avatar`, avatarFile, true); }
      catch (e) { toast(T('avatar_failed', e.message), true); load(); $('#pmSave').disabled = false; return; }
    }
    toast(editing ? T('saved') : T('player_added'));
    closePlayer(); load(); setTimeout(load, 5000);
  } catch (e) { toast(e.message, true); }
  $('#pmSave').disabled = false;
};
$('#pmColor').oninput = () => { $('#pmColorAuto').checked = false; };
$('#pmDelete').onclick = async () => {
  if (!editing || !confirm(T('confirm_player_del', editing.display_name, editing.samples))) return;
  try { await api(`/api/admin/player/${editing.id}/delete`, {}); toast(T('deleted')); closePlayer(); load(); } catch (e) { toast(e.message, true); }
};

async function boot() {
  try {
    const me = await api('/api/admin/me');
    if (!me.authed) return showLogin();
    $('#app').hidden = false;
    await load();
    setInterval(() => { if (!document.hidden && !$('#pmodal').classList.contains('show')) load().catch(() => {}); }, 15000);
  } catch (e) { if (!$('#loginView').hidden) return; document.body.innerHTML = `<div class="wrap"><div class="card"><h2>${T('error')}</h2><p>${esc(e.message)}</p></div></div>`; }
}
applyStatic();
boot();
</script>
